<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Terrarium</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #10151d;
        color: #dbe5f3;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      #info {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(16, 21, 29, 0.7);
        border: 1px solid rgba(219, 229, 243, 0.15);
        font-size: 13px;
        line-height: 1.35;
        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="info">
      Drag to move · Mouse wheel to zoom<br />
      10,000 x 10,000 tiles (culled to viewport)
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
  </html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Terrarium</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #10151d;
        color: #dbe5f3;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      #info {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(16, 21, 29, 0.7);
        border: 1px solid rgba(219, 229, 243, 0.15);
        font-size: 13px;
        line-height: 1.35;
        user-select: none;
        pointer-events: none;
      }

      #graph-panel {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        width: 300px;
        padding: 8px 10px 10px;
        border-radius: 8px;
        background: rgba(16, 21, 29, 0.78);
        border: 1px solid rgba(219, 229, 243, 0.15);
        color: #dbe5f3;
        font-size: 12px;
        user-select: none;
      }

      #graph-title {
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }

      #graph-stats {
        text-align: right;
        line-height: 1.35;
        font-variant-numeric: tabular-nums;
      }

      #graph-stats .muted {
        color: rgba(219, 229, 243, 0.55);
        font-size: 11px;
      }

      #bunny-graph {
        width: 100%;
        height: 120px;
        display: block;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="info">
      Drag to move · Mouse wheel to zoom<br />
      1,000 x 1,000 tiles (culled to viewport) · Bunny simulation tick: 1s
    </div>
    <div id="graph-panel">
      <div id="graph-title">
        <span>Bunnies</span>
        <div id="graph-stats">
          <div><span class="muted">pop</span> <span id="bunny-count">0</span></div>
          <div><span class="muted">births</span> <span id="bunny-births">0</span></div>
        </div>
      </div>
      <canvas id="bunny-graph" width="280" height="120"></canvas>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
  </html>
